[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kafka-lens"
version = "0.2.7"
description = "Fast Kafka message browser — a lightweight alternative to Confluent UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "confluent-kafka>=2.4.0",
    "fastavro>=1.9.4",
    "duckdb>=0.10.3",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3.0",
    "protobuf>=4.25.3",
    "aiofiles>=23.2.1",
    "orjson>=3.9.0",
    "certifi>=2024.0.0",
]

[project.scripts]
kafka-lens = "app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]
